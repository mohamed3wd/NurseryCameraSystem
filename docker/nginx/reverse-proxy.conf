# Optional single entry point (docker compose --profile proxy up).
#
# - Parent app + API/hub:  http://localhost/
# - Admin app:             http://localhost:81/
#
# Both Angular apps are built with base href "/", so the admin app is served
# on its own port here rather than under a sub-path (which would break its
# absolute asset URLs). RTSP is never proxied anywhere in this file - only
# the REST API, the SignalR hub, and the two pre-built static SPAs.

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend-parent:80/;
        proxy_set_header Host $host;
    }
}

server {
    listen 81;
    server_name _;

    location / {
        proxy_pass http://frontend-admin:80/;
        proxy_set_header Host $host;
    }
}
