name: nursery-camera-system

networks:
  public-network:
    driver: bridge
  internal-network:
    driver: bridge
    internal: true

volumes:
  sqlserver-data:
  redis-data:

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nursery-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-Your_strong_Password123!}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - internal-network
    ports:
      # Exposed to the host for local tooling (SSMS/Azure Data Studio) only.
      # Not reachable from the public-network.
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nursery-redis
    volumes:
      - redis-data:/data
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/NurseryCamera.Api/Dockerfile
    container_name: nursery-api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=NurseryCamera;User Id=sa;Password=${SQL_SA_PASSWORD:-Your_strong_Password123!};TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "nursery-camera:"
      Jwt__Issuer: ${JWT_ISSUER:-NurseryCameraSystem}
      Jwt__Audience: ${JWT_AUDIENCE:-NurseryCameraSystem.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CHANGE_ME_use_a_secret_manager_min_32_chars}
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "30"
      CameraSecurity__EncryptionKeyReference: ${CAMERA_SECRET_ENCRYPTION_KEY:-zrpQSMd/4/tmKosNIxzxDadIUFJcijvLcsVcV9tiyBc=}
      MediaGateway__ApiKey: ${MEDIA_GATEWAY_API_KEY:-CHANGE_ME_media_gateway_shared_secret}
      MediaGateway__BaseUrl: ${MEDIA_GATEWAY_PUBLIC_URL:-http://localhost:8088}
      MediaGateway__Provider: Go2Rtc
      MediaGateway__DefaultProtocol: webrtc
      MediaGateway__Go2RtcBaseUrl: "http://go2rtc:1984"
      MediaGateway__DemoSource: "ffmpeg:testsrc=size=1280x720:rate=15#video=h264#hardware=false"
      Cors__Origins__0: ${CORS_ORIGIN_PARENT:-http://localhost:4200}
      Cors__Origins__1: ${CORS_ORIGIN_ADMIN:-http://localhost:4300}
    networks:
      - internal-network
      - public-network
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: nursery-go2rtc
    volumes:
      - ./docker/go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    # go2rtc stays on the internal network only — browsers never talk to it directly.
    networks:
      - internal-network
    restart: unless-stopped

  media-gateway:
    build:
      context: .
      dockerfile: src/NurseryCamera.MediaGateway/Dockerfile
    container_name: nursery-media-gateway
    depends_on:
      - api
      - go2rtc
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8088
      NurseryApi__BaseUrl: "http://api:8080"
      NurseryApi__MediaGatewayApiKey: ${MEDIA_GATEWAY_API_KEY:-CHANGE_ME_media_gateway_shared_secret}
      Go2Rtc__BaseUrl: "http://go2rtc:1984"
      Cors__Origins__0: ${CORS_ORIGIN_PARENT:-http://localhost:4200}
      Cors__Origins__1: ${CORS_ORIGIN_ADMIN:-http://localhost:4300}
    networks:
      - internal-network
      - public-network
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend-parent:
    build:
      context: ./frontend/parent
      dockerfile: Dockerfile
    container_name: nursery-frontend-parent
    depends_on:
      - api
    networks:
      - public-network
    ports:
      - "4200:80"
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: nursery-frontend-admin
    depends_on:
      - api
    networks:
      - public-network
    ports:
      - "4300:80"
    restart: unless-stopped

  # Optional single entry point that fronts both SPAs and the API/hub on port 80.
  # Not required for local development - start it explicitly with:
  #   docker compose --profile proxy up
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: nursery-reverse-proxy
    profiles: ["proxy"]
    depends_on:
      - api
      - frontend-parent
      - frontend-admin
    volumes:
      - ./docker/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public-network
    ports:
      - "80:80"
    restart: unless-stopped
